# -------------------------------
# Prometheus Configuration
# -------------------------------
global:
  scrape_interval: 15s  # scrape every 15 seconds
  evaluation_interval: 15s

scrape_configs:
  # -------------------------------
  # Prometheus self-monitoring
  # -------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # -------------------------------
  # Web Servers
  # -------------------------------
  - job_name: 'web-servers'
    static_configs:
      - targets: ['web-server-1:80', 'web-server-2:80']

  # -------------------------------
  # HAProxy
  # -------------------------------
  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:80']

  # -------------------------------
  # Jenkins
  # -------------------------------
  - job_name: 'jenkins'
    metrics_path: /prometheus
    static_configs:
      - targets: ['jenkins:8080']

  # -------------------------------
  # Node Exporters
  # -------------------------------
  - job_name: 'node-exporters'
    static_configs:
      - targets: ['node-exporter-1:9100', 'node-exporter-2:9100']

# Notes:
# - All targets are container names because they share Docker networks with Prometheus.
# - Node exporters expose system metrics (CPU, memory, disk) for each node container.
# - Web servers, HAProxy, and Jenkins metrics can be scraped once their exporters are enabled if needed.

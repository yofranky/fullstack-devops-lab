input {
  beats {
    port => 5044
  }
}

filter {
  # Basic parsing for web server logs
  if [source] =~ "web-server" {
    grok {
      match => { "message" => "%{COMMONAPACHELOG}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "homelab-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}

version: '3.8'

services:
  # -------------------------------
  # Web Servers (App Layer)
  # -------------------------------
  web-server-1:
    build: ./web-server-1
    container_name: web1
    ports:
      - "8081:80"   # direct access (optional)
    networks:
      - app-net

  web-server-2:
    build: ./web-server-2
    container_name: web2
    ports:
      - "8082:80"   # direct access (optional)
    networks:
      - app-net

  # -------------------------------
  # Load Balancer (HAProxy)
  # -------------------------------
  haproxy:
    image: haproxy:latest
    container_name: haproxy
    volumes:
      - ./load-balancer/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    ports:
      - "80:80"   # expose VIP to host
    depends_on:
      - web-server-1
      - web-server-2
    networks:
      - app-net

  # -------------------------------
  # Database (SQL Layer)
  # -------------------------------
  database:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: homelab
      MYSQL_USER: labuser
      MYSQL_PASSWORD: labpass
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - app-net

  # -------------------------------
  # Jenkins (CI/CD)
  # -------------------------------
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - app-net

  # -------------------------------
  # Prometheus (Metrics Collection)
  # -------------------------------
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring-net

  # -------------------------------
  # Grafana (Dashboards)
  # -------------------------------
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring-net

  # -------------------------------
  # Elasticsearch (Logs Storage)
  # -------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - logging-net

  # -------------------------------
  # Logstash (Log Ingest)
  # -------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: logstash
    volumes:
      - ./elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - logging-net

  # -------------------------------
  # Kibana (Log Dashboard)
  # -------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - logging-net

# -------------------------------
# Volumes
# -------------------------------
volumes:
  db_data:
  jenkins_home:
  grafana_data:
  es_data:

# -------------------------------
# Networks
# -------------------------------
networks:
  app-net:
  monitoring-net:
  logging-net:
